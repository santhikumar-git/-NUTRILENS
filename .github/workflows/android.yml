
name: NUTRILENS Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --org com.nutrilens build_app

      - name: Copy NUTRILENS source
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Build AAB
        working-directory: build_app
        run: flutter build appbundle --release

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: NUTRILENS-Android-Builds
          path: |
            build_app/build/app/outputs/flutter-apk/app-release.apk
            build_app/build/app/outputs/bundle/release/app-release.aab
